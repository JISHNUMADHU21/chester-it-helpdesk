services:
  db:
    image: postgres:16
    container_name: chester_postgres
    environment:
      POSTGRES_DB: chester_helpdesk
      POSTGRES_USER: chester_admin
      POSTGRES_PASSWORD: Chester@2026
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chester_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: